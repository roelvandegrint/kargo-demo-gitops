apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/roelvandegrint/kargo-demo-gitops.git
    targetRevision: HEAD
    path: argocd/overlays/sandbox

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
